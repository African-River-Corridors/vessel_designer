[project]
name = "vessel_designer"
version = "0.1.0"
description = "Concept design of inland and coastal cargo vessels: GA, characteristics, BOQ, cost — calibrated on real vessels."
requires-python = ">=3.12"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "African River Corridors Limited" }]
readme = "README.md"
dependencies = ["numpy>=1.26", "pyyaml>=6"]

[project.urls]
Repository = "https://github.com/African-River-Corridors/vessel_designer"

[project.optional-dependencies]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/vessel_designer"]

# The illustrative cost-rates file lives in examples/ for readers and ships inside the package as
# the default for core.barge_cost, so an installed copy finds it through importlib.resources.
[tool.hatch.build.targets.wheel.force-include]
"examples/barge_cost_rates.example.yaml" = "vessel_designer/data/barge_cost_rates.example.yaml"

[tool.pytest.ini_options]
testpaths = ["tests"]
