notation_reference:
- scheme: BV NR217 inland range of navigation IN(x)
  meaning: x = admissible significant wave height Hs (m). IN(0.6) sheltered; dry-dock survey required when range
    > IN(1.2) or brackish/salt water; annual survey may be required when wave height > 1.20 m.
  estuary_plus: 'Optional notation ''Estuary Plus'' for inland vessels in restricted maritime areas with Hs 0.6
    < x <= 2 m. Example: ''5 Z IN(1,7) / Estuary Plus / Belgian coast ... within 5NM from shore / Beaufort 7''.'
  source: J.M. Chatelier (BV), CCNR workshop 2019-09-11, https://ccr-zkr.org/files/documents/workshops/wrshp110919/03_JMChatelier_en.pdf
    slides 4,5,14; ISSW2017 Chatelier et al. (IN(0.6<=Hs<=2 m))
  confidence: high
- scheme: RS (Russian Maritime Register) restricted area R2-RSN / R2-RSN(4,5) / R3-RSN
  meaning: 'R3-RSN: sea and river navigation at 3% wave height 3.5 m, max 50 miles from place of refuge. R2-RSN(4,5):
    intermediate class, same areas as R2-RSN but stricter sea state (4.5 m). R2-RSN limits not confirmed from a
    primary source in this pass.'
  source: rs-class.org NTS issue 36 (2013) abstract via search; full text behind login
  confidence: medium
- scheme: Russian River Register (RRR) classes M-SP, M-PR, O-PR
  meaning: Mixed river-sea classes. 'Sibirsky', 'Volgo-Balt', 'Amur', 'STK', 'Omsky', 'Volgoneft', 'Lenaneft' types
    belong to M-SP and M-PR. Numeric suffix (e.g. 'O-PR 2,0', 'M-SP 3.5') is the permitted wave height (m). Exact
    wave thresholds per class not confirmed from primary source.
  source: search summary of PCA exhibit UA-92 / RS papers; RSD30 notation 'O-PR 2,0 (ice 20) A' at https://mebspb.com/drye/RSD30e.html
  confidence: low
