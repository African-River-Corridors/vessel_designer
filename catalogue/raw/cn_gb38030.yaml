  - id: GB38030.2-2019
    title_cn: "内河过闸运输船舶标准船型主尺度系列 第2部分：京杭运河、淮河水系"
    title_en: "Dimensions series of standard transport ship types passing the locks of inland rivers — Part 2: Crand Canal and Huai River system"   # sic: cover prints "Crand" (Grand)
    status: current
    issued: 2019-07-29
    effective: 2020-02-01
    scope_en: "New and reconstructed ships passing locks of the Beijing–Hangzhou Grand Canal and Huai River system: dry bulk, chemical, oil, barge, container, ro-ro."
    definitions:
      - {term_cn: "淮河水系", term_en: "Huai River system", def_en: "Waterways including the Shaying River–Huai River trunk line."}
    general_rules:
      - {clause: "3.1/3.2", cn: "总长、总宽定义同GB 38030.1—2019 2.1、2.2", en: "LOA and BOA as defined in GB 38030.1-2019 clauses 2.1 and 2.2."}
      - {clause: "5.1", cn: "本尺度系列中船舶总宽可下浮不超过2%，船舶总长可下浮不超过10%", en: "BOA may be up to 2% below the series value; LOA up to 10% below."}
      - {clause: "5.2", cn: "固定突出物计入总长和总宽；未能提起的活动突出物计入总长和总宽", en: "Fixed protrusions (sponson decks, fenders, bulwarks, pushing gear, outboard motors and brackets, false bow/stern) count toward LOA and BOA; movable protrusions (tyres, fenders) count if not lifted before the lock."}
      - {clause: "5.3", cn: "过闸船舶应满足适用通航水域的限制条件", en: "Ships must meet the limits of the applicable navigable waters."}
      - {clause: "5.4", cn: "多用途船主尺度应同时满足适装货类对应船型的尺度限制", en: "Multipurpose ships must meet the limits of every ship type matching their cargoes."}
      - {clause: "6.2", cn: "与驳船组成船队的总长、总宽应控制在航道、船闸允许的范围内", en: "Overall length and breadth of a barge train must stay within waterway and lock limits."}
    code_scheme: >-
