  # ------------------------------------------------------------------------------------------
  - id: GB38030.1-2026
    title_cn: "内河过闸运输船舶标准船型主尺度系列 第1部分：长江水系"
    title_en: "Dimensions series of standard transport ship types passing the locks of inland rivers — Part 1: Changjiang River system"
    status: "current from 2026-12-01 (replaces GB 38030.1-2019)"
    issued: 2026-08-27
    effective: 2026-12-01
    scope_en: "New and reconstructed ships passing locks, ship lifts etc. of the Changjiang trunk line and main tributaries (excl. Three Gorges ship lift): dry (bulk) cargo, chemical liquid-cargo, oil, barge, container, ro-ro (commercial vehicle carrier). Self-unloading sand carriers deleted."
    data_note: "Tables give only 最大船宽 (extreme breadth) and 最大船长 (extreme length), unit m. No reference DWT/TEU/car spaces. New type codes."
    definitions:
      - {term_cn: "长江主要支流", term_en: "Changjiang main tributaries", def_en: "High-grade waterways of the Min, Jialing, Jinsha, Wu, Xiang, Yuan, Han rivers, Jianghan Canal, Gan, Xin rivers and the Jianghuai Canal; Jianghuai Canal covers only the Hefei–Yuxi line, the Yinjiang-Jichao Caizi Lake line, and Dongfei River mouth to Chaohu Lake (scope note 1)."}
    general_rules:
      - {clause: "3.1", cn: "总长：船体及上层建筑的船首最前端到船尾最后端之间的水平距离（不包括首尾突出物）", en: "Length overall: horizontal distance from foremost to aftmost point of hull and superstructure; metal hulls to inner surface, non-metal to outer surface; excludes end protrusions (sponson decks, fenders, bulwarks, pushing gear, outboard motors and brackets, false bow/stern, movable protrusions)."}
      - {clause: "3.2", cn: "总宽：船体从一舷到另一舷垂直于纵中线面方向量至船壳外板的最大距离（不包括两舷突出物）", en: "Breadth overall: maximum breadth of hull to shell plating, perpendicular to the longitudinal centreline plane; metal hulls to inner surface, non-metal to outer; excludes side protrusions (sponson decks, fenders, bulwarks, movable protrusions)."}
      - {clause: "3.3", cn: "最大船长：包括船舶外板和首尾两端结构性突出物、活动突出物在内的水平距离", en: "Extreme length: horizontal distance including shell plating and structural protrusions (sponson decks, fenders, bulwarks, false bow/stern, pushing gear) and movable protrusions (gangways/ramps, crane jibs, conveyors — measured as in navigation condition)."}
      - {clause: "3.4", cn: "最大船宽：包括船舶外板和舷侧结构性突出物在内的最大横向水平距离", en: "Extreme breadth: maximum transverse distance including shell plating and side structural protrusions (sponson decks, fenders); tyres/fenders that cannot be retracted before the lock count too."}
      - {clause: "4.1", cn: "船舶总宽在对应船型最大船宽基础上下浮不应超过2%；船舶总长在对应船型最大船长基础上下浮不应超过10%", en: "A ship's breadth overall may be no more than 2% below the type's extreme breadth; length overall no more than 10% below the type's extreme length."}
      - {clause: "4.2", cn: "过闸船舶应满足适用通航水域的限制条件", en: "Ships passing locks must meet the limits of the applicable navigable waters."}
      - {clause: "4.3", cn: "多用途船、集散两用船主尺度应同时满足适装货类对应船型的尺度限制", en: "Multipurpose and container/bulk dual-use ships must meet the dimension limits of every ship type matching their cargoes."}
    code_scheme: >-
      图1 ××-×××-××× : 航行区域 navigation region (CG 长江干线 Changjiang trunk line; CZ 长江主要支流 Changjiang main tributaries)
      - 最大船宽 extreme breadth per clause 6 (×10, e.g. 163 = 16.3 m, 078 = 7.8 m)
      - 船舶类型 ship type (H 干(散)货船、化学品液货船、油船 dry (bulk) cargo/chemical liquid-cargo/oil; B 驳船 barge;
      J 集装箱船 container; G 滚装船(商品汽车运输船) ro-ro (commercial vehicle carrier))
      + 船型序号 serial within the same breadth and type
      + 后缀 suffix (N 与前一版标准相比为新增 new vs previous edition; M 部分修改 partly modified; R 保持不变 retained unchanged).
      Example (示例): CG-163-H1R = Changjiang trunk line dry (bulk)/chemical/oil type, extreme breadth 16.3 m, serial 1, unchanged from previous edition.
