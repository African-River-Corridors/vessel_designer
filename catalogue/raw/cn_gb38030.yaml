# GB 38030 — 内河过闸运输船舶标准船型主尺度系列
# Dimensions series of standard transport ship types passing the locks of inland rivers (China).
# Transcribed 2026-10-06 from the PDFs in ~/Downloads (GB+38030.1..5-2019, GB+38030.1-2026).
# Parts 1, 2, 5 (2019) and 1 (2026): text layer, checked against page images.
# Parts 3, 4 (2019): page images only (broken font encoding in text layer).
# Merged cells are repeated on every row they cover. Type codes are as printed (2019 codes carry a
# hyphen, e.g. "CG-H1"; the text layer drops it). Thousand separators (thin space, "1 000") removed.
# Only printed values; nothing inferred.
#
# 2019 tables give 总宽 BOA (m), 总长 LOA (m) and a reference column.
# 2026 tables give only 最大船宽 (extreme breadth, m) and 最大船长 (extreme length, m) — no reference
# DWT/TEU/cars — and use new type codes (region-breadth×10-type+serial+N/M/R suffix).
#
# Mandatory vs recommended (all 2019 parts, preface): the BOA and LOA values in the tables are
# mandatory (强制性); all other parameters are recommended (推荐性).

standard: GB 38030
title_cn: "内河过闸运输船舶标准船型主尺度系列"
title_en: "Dimensions series of standard transport ship types passing the locks of inland rivers"
category_key:
  dry_bulk_chemical_oil: "干散货船、化学品船、油船 — dry bulk carrier, chemical tanker, oil tanker (Part 3: 干散货船、液货船 dry bulk & liquid cargo ship; 2026: 干(散)货船、化学品液货船、油船 dry (bulk) cargo ship, chemical liquid-cargo tanker, oil tanker)"
  barge: "驳船 — barge"
  container: "集装箱船 — container ship"
  ro_ro: "滚装货船 — ro-ro cargo ship (car carrier); 2026: 滚装船(商品汽车运输船) ro-ro ship (commercial vehicle carrier)"
  sand_self_unloader: "自卸砂船 — self-unloading sand carrier"

