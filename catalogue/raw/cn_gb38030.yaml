  # ------------------------------------------------------------------------------------------
  - id: GB38030.1-2019
    title_cn: "内河过闸运输船舶标准船型主尺度系列 第1部分：长江水系"
    title_en: "Dimensions series of standard transport ship types passing the locks of inland rivers — Part 1: Changjiang River system"
    status: "superseded by GB 38030.1-2026 from 2026-12-01"
    issued: 2019-07-29
    effective: 2020-02-01
    scope_en: "New and reconstructed ships passing locks, ship lifts etc. of the Changjiang (Yangtze) system, excluding the Three Gorges ship lift."
    definitions:
      - {term_cn: "长江水系", term_en: "Changjiang River system", def_en: "Changjiang trunk line plus Changjiang branch lines."}
      - {term_cn: "长江支线", term_en: "Changjiang branch lines", def_en: "Min, Jialing, Wu, Xiang, Yuan, Han rivers, Jianghan Canal, Gan, Xin rivers and the Hefei–Yuxi (合裕线) waterway."}
    general_rules:
      - {clause: "2.1", cn: "总长LOA：船体(包括首、尾升高甲板)及上层建筑的船首最前端到船尾最后端之间的水平距离，不包括船首尾两端的突出物", en: "LOA: horizontal distance from foremost to aftmost point of hull (incl. raised fore/aft decks) and superstructure; metal hulls to inner surface of plating, FRP/non-metal hulls to outer surface; excludes end protrusions (sponson decks, fenders, bulwarks, pushing gear, outboard motors and brackets, false bow/stern, movable protrusions)."}
      - {clause: "2.2", cn: "总宽BOA：从一舷到另一舷垂直于中线面方向量至船壳外板外侧的最大距离，舷伸甲板和护舷材等突出物不计入", en: "BOA: maximum breadth to the outside of shell plating, perpendicular to the centreline plane; sponson decks, fenders and similar protrusions not counted."}
      - {clause: "4.1", cn: "本尺度系列中船舶总宽可下浮不超过2%，船舶总长可下浮不超过10%", en: "A ship's BOA may be up to 2% below the series value; LOA may be up to 10% below."}
      - {clause: "4.2", cn: "固定突出物其长度和宽度应分别计入总长和总宽；活动突出物过闸前未能提起的，应计入总长和总宽", en: "Fixed protrusions at ends or sides (sponson decks, fenders, bulwarks, pushing gear, outboard motors and brackets, false bow/stern) count toward LOA and BOA. Movable protrusions (tyres, fenders) count if not lifted before passing the lock."}
      - {clause: "4.3", cn: "过闸船舶应满足适用通航水域的限制条件", en: "Ships passing locks must meet the limits of the applicable navigable waters."}
      - {clause: "4.4", cn: "多用途船主尺度应同时满足适装货类对应船型的尺度限制", en: "Multipurpose ships must meet the dimension limits of every ship type matching the cargoes they carry."}
      - {clause: "5.1.2/5.2.2", cn: "与驳船组成船队的总长、总宽应控制在航道、船闸允许的范围内", en: "Overall length and breadth of a barge train must stay within waterway and lock limits."}
    code_scheme: >-
      图1 □-□□ : 航行区域 navigation region (CG 长江干线 Changjiang trunk line; CZ 长江支线 Changjiang branch lines)
      - 船舶类型 ship type (H 干散货船、化学品船、油船 dry bulk/chemical/oil; B 驳船 barge; J 集装箱船 container;
      G 滚装货船 ro-ro cargo; Z 自卸砂船 self-unloading sand carrier) + 尺度系列序号 serial number in the series.
      Example (示例): CG-H1 = first Changjiang-trunk-line dry bulk/chemical/oil standard type.
