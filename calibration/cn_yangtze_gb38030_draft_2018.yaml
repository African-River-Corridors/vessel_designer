# A DRAFT note, not the issued standard. Facts transcribed; no text reproduced. Read 2026-10-06.
source_id: GB38030.1-draft-2018-note
method:  # §2.2 技术模型, pp. 11-12
  lightship:
    formula: "LW = C * Lpp^1.4 * B^0.75 * D^0.4"     # t; Lpp, B, D in m
    C: {bulk: 0.128, liquid: 0.130, container: 0.129}
    ro_ro: {formula: "LW = 0.13 * Lpp^1.85 * B^0.9 * D^0.7"}
    open_issue: "Heading says 空船重量 (lightship), body says 钢料重量 (steel weight). Resolve before use."
  deadweight: "DW = displacement - LW"
  consumables_t: "YW = P_main_kW * n_engines * 0.25 * endurance / speed / 1000 + crew * 1.5"
  cargo: "cargo = DW - YW"
  cost_wan_cny: "P = C1 * LW  (+ length term L when LOA > 120 m: if L/B > 7.3 then (L/B - 7.3)*30 + 100)"
  C1: {bulk: 1.0, liquid: 1.8, container: 1.2}
  note: "The cost-formula layout across the page break is ambiguous; the length term's units are not stated."
