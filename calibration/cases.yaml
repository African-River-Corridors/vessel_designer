# Calibration cases: real (or published design) vessels whose inputs we run through the core
# and whose published figures we compare against. One row = one vessel/design at one condition.
# Every observed figure cites a source (see calibration/ga_sources notes and catalogue/raw/).
# kind:
#   dry_barge  — pushed dry-cargo barge. Checks lightship and/or deadweight at a stated draught.
#   motor_point — self-propelled design point with displacement, cargo and installed power.

# hold_type: box (vertical inner sides) | container. All cases below are pushed barges.
# exclude_from_fit: a reason, when the published figures cannot all describe one condition.
dry_barge:
  - id: para-mississippi-2200
    hold_type: box
    what: "Mississippi-type box hopper barge, model barge of UFPA thesis Table 04"
    loa_m: 60.96
    beam_m: 10.67
    depth_m: 4.27
    draught_m: 3.66
    observed: {lightship_t: 263.85, dwt_t: 2200}
    source: "UFPA dissertation 2022, Formação de comboios fluviais, sec 3.1.1 / Tabela 04 (repositorio.ufpa.br/bitstream/2011/15059)"
    confidence: medium
    exclude_from_fit_cb: "implied Cb > 1 on LOA: DWT and lightship cannot both be at T = 3.66 m"
  - id: amaggi-box-2000
    hold_type: box
    what: "Amaggi Amazon box barge, 195 x 35 ft Mississippi hull"
    loa_m: 60.96
    beam_m: 10.67
    depth_m: 4.27
    draught_m: 3.56
    observed: {dwt_t: 2000}
    source: "UFPA dissertation 2022, sec 2.5.1.2"
    confidence: medium
