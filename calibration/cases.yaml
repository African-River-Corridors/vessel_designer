motor_point:
  # GB 38030.1 draft explanatory note (2018), Tables 3-3/3-4: design-study points.
  # Columns: loa, boa, T, displacement t, cargo t, main power kW. Speed per table.
  source: "calibration/cn_yangtze_gb38030_draft_2018.yaml"
